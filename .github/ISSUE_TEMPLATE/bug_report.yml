name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    attributes:
      label: Browser and version
      placeholder: Chrome 131 on macOS
  - type: input
    attributes:
      label: Redirectory version
      placeholder: 1.1.0 (see chrome://extensions)
