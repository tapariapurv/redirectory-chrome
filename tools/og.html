<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:100 900;src:url(../docs/assets/inter.woff2) format('woff2')}
*{box-sizing:border-box}body{margin:0;width:1280px;height:640px;font-family:Inter;background:#f6f4f0;overflow:hidden;position:relative}
.glow{position:absolute;inset:-200px auto auto -200px;width:900px;height:800px;background:radial-gradient(closest-side,rgba(232,85,44,.16),transparent 70%)}
.copy{position:absolute;left:72px;top:96px;width:520px}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px;letter-spacing:-.02em;color:#17161a}
h1{margin:44px 0 0;font-size:76px;line-height:.98;letter-spacing:-.045em;font-weight:760;color:#17161a}
p{margin:26px 0 0;font-size:25px;line-height:1.45;color:#4a4750}
.chip{display:inline-flex;margin-top:34px;padding:10px 18px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);font-size:19px;font-weight:600;color:#4a4750}
.shot{position:absolute;left:640px;top:70px;width:900px;border-radius:20px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.05),0 40px 80px -20px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.08)}
.shot img{display:block;width:100%}
</style></head><body>
<div class="glow"></div>
<div class="copy">
  <div class="brand"><img src="../docs/assets/logo.svg" width="52" height="52">Redirectory</div>
  <h1>Redirect the reflex.</h1>
  <p>Block distracting sites. Land on your Notion, Todoist or built-in to-do list instead.</p>
  <div class="chip">Free · Open source · Chrome extension</div>
</div>
<div class="shot"><img src="../docs/screenshots/blocked-light.png"></div>
</body></html>
