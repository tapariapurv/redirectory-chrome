<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirected · Redirectory</title>
    <link rel="icon" href="../assets/icons/icon-32.png" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="tasks.css" />
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <main class="split">
      <section class="left">
        <header class="top">
          <span class="brand" id="brand"></span>
          <span class="tag" id="preview-tag" hidden>Preview</span>
        </header>

        <div class="hero">
          <div class="site-chip" id="site-chip"></div>
          <h1 id="headline">Is this on purpose?</h1>
          <p class="lede" id="lede"></p>

          <div class="primary-actions">
            <button class="btn btn-primary btn-lg" id="back-btn">
              <span id="back-label">Back to work</span>
              <span class="kbd kbd-on-accent">esc</span>
            </button>
          </div>

          <form class="continue-card" id="continue-form" autocomplete="off">
            <div class="continue-head">
              <span class="continue-title">Still need it?</span>
              <span class="continue-sub" id="continue-sub"></span>
            </div>
            <input class="input" id="reason" name="reason" maxlength="120" placeholder="What are you going there for?" />
            <div class="continue-row">
              <div class="segmented" id="durations" role="group" aria-label="Allow for"></div>
              <button class="btn btn-ghost continue-btn" id="continue-btn" type="submit" disabled>
                <svg class="ring" viewBox="0 0 20 20" aria-hidden="true">
                  <circle cx="10" cy="10" r="8" class="ring-track" />
                  <circle cx="10" cy="10" r="8" class="ring-fill" id="ring-fill" />
                </svg>
                <span id="continue-label">Continue</span>
              </button>
            </div>
          </form>
        </div>

        <footer class="stats" id="stats"></footer>
      </section>

      <section class="panel" id="panel" aria-label="Focus panel">
        <div class="panel-head">
          <div class="panel-tabs" id="panel-tabs" role="tablist"></div>
          <div class="panel-tools">
            <button class="icon-btn" id="reload-embed" title="Reload"></button>
            <a class="icon-btn" id="open-embed" title="Open in new tab" target="_blank" rel="noopener"></a>
            <a class="btn btn-quiet btn-sm add-app" id="panel-settings" title="Add Notion, Todoist and more" href="options.html#focus" target="_blank"></a>
          </div>
        </div>
        <div class="panel-body" id="panel-body"></div>
      </section>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
